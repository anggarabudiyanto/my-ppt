# ==============================================================================
#  BUILD-PDF.YML — Kompilasi otomatis presentasi menjadi PDF via GitHub Actions
#  -----------------------------------------------------------------------------
#  Setiap kali kode di-push (folder template/ berubah), GitHub:
#    1. memasang TeX Live + biber,
#    2. mengompilasi template/main.tex  (pdflatex -> biber -> pdflatex x2),
#    3. menyimpan hasil main.pdf sebagai ARTIFACT "Template-Presentasi-PDF"
#       (unduh dari tab Actions pada run terbaru),
#    4. pada branch main: memperbarui RELEASE "PDF Terbaru" berisi PDF siap
#       unduh (tab Releases pada halaman repositori).
#  Tidak perlu memasang apa pun di komputer Anda untuk mendapatkan PDF.
# ==============================================================================
name: Build PDF

on:
  push:
    branches: ["**"]          # jalankan di semua branch (termasuk branch kerja)
    paths:
      - "template/**"
      - ".github/workflows/build-pdf.yml"
  pull_request:
    paths:
      - "template/**"
  workflow_dispatch:          # izinkan "Run workflow" manual dari tab Actions

permissions:
  contents: write             # dibutuhkan untuk membuat/memperbarui Release

jobs:
  compile:
    name: Kompilasi LaTeX -> PDF
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repositori
        uses: actions/checkout@v4

      - name: Pasang TeX Live (pdflatex, biblatex) dan biber
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            biber

      # PROBE: biseksi penyebab error — 4 varian dokumen uji
      - name: Probe biseksi biblatex/beamer
        working-directory: template
        run: |
          mkdir -p /tmp/pb/v2
          # V1: beamer + ppt.sty utuh (harusnya gagal seperti dokumen asli)
          cat > /tmp/pb/v1.tex <<'EOF'
          \documentclass[11pt,aspectratio=169]{beamer}
          \usepackage{ppt}
          \begin{document}\begin{frame}uji\end{frame}\end{document}
          EOF
          # V2: beamer + ppt.sty TANPA baris \xapptobibmacro (kompilasi dari
          #     folder sendiri agar memakai ppt.sty yang sudah dimodifikasi)
          sed 's/^\\xapptobibmacro/%NOPATCH% \\xapptobibmacro/' ppt.sty > /tmp/pb/v2/ppt.sty
          cp bib.bib /tmp/pb/v2/
          cat > /tmp/pb/v2/v2.tex <<'EOF'
          \documentclass[11pt,aspectratio=169]{beamer}
          \usepackage{ppt}
          \begin{document}\begin{frame}uji\end{frame}\end{document}
          EOF
          # V3: beamer + biblatex + xpatch + \firstcite (inti mekanisme)
          cat > /tmp/pb/v3.tex <<'EOF'
          \documentclass[11pt,aspectratio=169]{beamer}
          \usepackage[style=numeric,sorting=none,backend=biber]{biblatex}
          \addbibresource{bib.bib}
          \usepackage{xpatch}
          \xapptobibmacro{cite}{\setunit{\nametitledelim}\printfield{title}\setunit{\nametitledelim}\printfield{year}}
          \DeclareCiteCommand{\firstcite}
            {\usebibmacro{prenote}}
            {\footnotemark[\thefield{labelnumber}]}
            {\multicitedelim}
            {\usebibmacro{postnote}}
          \begin{document}\begin{frame}uji \cite{barnett2009quantum}\end{frame}\end{document}
          EOF
          # V4: seperti V3 tanpa \xapptobibmacro
          grep -v '^\\xapptobibmacro' /tmp/pb/v3.tex > /tmp/pb/v4.tex || true
          if pdflatex -interaction=nonstopmode -output-directory=/tmp/pb /tmp/pb/v1.tex > /tmp/pb/v1.out 2>&1; then echo "::error::V1 OK"; else echo "::error::V1 GAGAL: $(grep -m1 -A1 '^! ' /tmp/pb/v1.out | head -c 220)"; fi
          ( cd /tmp/pb/v2 && pdflatex -interaction=nonstopmode v2.tex > /tmp/pb/v2.out 2>&1 ) && echo "::error::V2 OK" || echo "::error::V2 GAGAL: $(grep -m1 -A1 '^! ' /tmp/pb/v2.out | head -c 220)"
          if pdflatex -interaction=nonstopmode -output-directory=/tmp/pb /tmp/pb/v3.tex > /tmp/pb/v3.out 2>&1; then echo "::error::V3 OK"; else echo "::error::V3 GAGAL: $(grep -m1 -A1 '^! ' /tmp/pb/v3.out | head -c 220)"; fi
          if pdflatex -interaction=nonstopmode -output-directory=/tmp/pb /tmp/pb/v4.tex > /tmp/pb/v4.out 2>&1; then echo "::error::V4 OK"; else echo "::error::V4 GAGAL: $(grep -m1 -A1 '^! ' /tmp/pb/v4.out | head -c 220)"; fi

      - name: Kompilasi (pdflatex -> biber -> pdflatex x2)
        working-directory: template
        run: |
          # Bila pdflatex/biber gagal, baris error diekstrak dari berkas .log
          # dan dilaporkan sebagai anotasi GitHub agar mudah dibaca.
          if ! pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex; then
            echo "::error::pdflatex putaran 1 gagal"
            grep -m 8 -E "^[^ ]+\.tex:[0-9]+:|^! " main.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:250}"; done
            exit 1
          fi
          if ! biber main; then
            echo "::error::biber gagal"
            grep -m 5 -iE "ERROR" main.blg | head -5 | while IFS= read -r l; do echo "::error::${l:0:250}"; done
            exit 1
          fi
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      # Diagnosa: kirim potongan akhir main.log sebagai anotasi GitHub, lalu
      # upayakan menyimpan log/PDF ke folder ci/ di branch.
      - name: Lampirkan log/hasil ke branch (diagnosa)
        if: always()
        run: |
          # Batas anotasi per langkah = 10. Prioritas: baris error LaTeX
          # (dengan satu baris konteks di atasnya).
          if [ -f template/main.log ]; then
            grep -n -B1 -m 4 -E "^! |Fatal error|Runaway|Emergency|\.(tex|sty|cls|clo|def):[0-9]+:" template/main.log | head -8 | while IFS= read -r l; do echo "::error::ERR ${l:0:230}"; done
          else
            echo "::error::main.log TIDAK ADA"; ls template | head -10
          fi
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          mkdir -p ci
          [ -f template/main.log ] && cp template/main.log ci/main.log || true
          [ -f template/main.blg ] && cp template/main.blg ci/main.blg || true
          if [ -f template/main.pdf ]; then
            cp template/main.pdf ci/Template-Presentasi-Telkom-University.pdf
          fi
          git add -A ci || true
          if git diff --cached --quiet; then
            echo "::error::STAGING-KOSONG (tidak ada file untuk di-commit)"
          else
            git commit -m "CI: log & hasil kompilasi [skip ci]" || echo "::error::commit-gagal"
            out=$(git push origin HEAD:${{ github.ref_name }} 2>&1) && echo "::error::PUSH-OK ${out:0:180}" || echo "::error::PUSH-GAGAL ${out:0:180}"
          fi

      - name: Simpan PDF sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Template-Presentasi-PDF-${{ github.run_number }}
          path: template/main.pdf
          if-no-files-found: error

      - name: Perbarui Release "PDF Terbaru" (hanya di branch main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-terbaru
          name: "PDF Terbaru"
          body: |
            PDF ter kompilasi otomatis dari commit ${{ github.sha }}.
            Berkas: **Template-Presentasi-Telkom-University.pdf**
          files: template/main.pdf
          make_latest: true
