# ==============================================================================
#  BUILD-PDF.YML — Kompilasi otomatis presentasi menjadi PDF via GitHub Actions
#  ------------------------------------------------------------------------------
#  Setiap kali berkas template di-push, GitHub:
#    1. memasang TeX Live,
#    2. mengompilasi main.tex di AKAR repo (pdflatex -> bibtex -> pdflatex x2),
#    3. menyimpan hasil main.pdf sebagai ARTIFACT "Presentasi-PDF"
#       (unduh dari tab Actions pada run terbaru),
#    4. pada branch main: memperbarui RELEASE "PDF Terbaru" berisi PDF siap
#       unduh (tab Releases pada halaman repositori).
#  Tidak perlu memasang apa pun di komputer Anda untuk mendapatkan PDF.
# ==============================================================================
name: Build PDF

on:
  push:
    branches: ["**"]                    # jalankan di semua branch (termasuk kerja)
    paths:
      - "*.tex"
      - "*.sty"
      - "bib.bib"
      - "gambar/**"
      - ".github/workflows/build-pdf.yml"
  pull_request:
    paths:
      - "*.tex"
      - "*.sty"
      - "bib.bib"
  workflow_dispatch:                    # izinkan "Run workflow" manual dari tab Actions

permissions:
  contents: write                       # dibutuhkan untuk membuat/memperbarui Release

jobs:
  compile:
    name: Kompilasi LaTeX -> PDF
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repositori
        uses: actions/checkout@v4

      - name: Pasang TeX Live (pdflatex, biblatex, bibtex)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-plain-generic \
            texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Kompilasi (pdflatex -> bibtex -> pdflatex x2)
        # Bila pdflatex/bibtex gagal, baris error diekstrak dari berkas .log
        # dan dilaporkan sebagai anotasi GitHub agar mudah dibaca.
        run: |
          if ! pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex; then
            echo "::error::pdflatex putaran 1 gagal"
            grep -m 8 -E "^! |Fatal error|[a-z]+\.(tex|sty|cls):[0-9]+:" main.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:250}"; done
            exit 1
          fi
          if ! bibtex main; then
            echo "::error::bibtex gagal"
            grep -m 5 -iE "error" main.blg | head -5 | while IFS= read -r l; do echo "::error::${l:0:250}"; done
            exit 1
          fi
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      - name: Simpan PDF sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presentasi-PDF-${{ github.run_number }}
          path: main.pdf
          if-no-files-found: error

      - name: Perbarui Release "PDF Terbaru" (hanya di branch main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-terbaru
          name: "PDF Terbaru"
          body: |
            PDF terkompilasi otomatis dari commit ${{ github.sha }}.
            Berkas: **main.pdf**
          files: main.pdf
          make_latest: true
